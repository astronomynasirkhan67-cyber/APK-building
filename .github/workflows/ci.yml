name: NK Builder CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r server/requirements.txt

      - name: Start server
        run: |
          nohup uvicorn server.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Test health, home page and ZIP inspect
        run: |
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/ | grep -qi "<html"
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("test.zip", "w") as z:
              z.writestr("app/build.gradle", "")
              z.writestr("app/settings.gradle", "")
          PY
          curl -sf -F "file=@test.zip" http://127.0.0.1:8000/api/inspect | grep -q android_gradle

      - name: Show server log if failed
        if: failure()
        run: cat server.log
